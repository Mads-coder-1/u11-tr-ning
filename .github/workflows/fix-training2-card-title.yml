name: Fix Training 2 card title

on:
  push:
    paths:
      - '.github/workflows/fix-training2-card-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Replace 2 of 3 with 2 of 6 in rendered card
        run: |
          cp assets/training2/u11-training2-card.png /tmp/before.png
          convert assets/training2/u11-training2-card.png \
            -fill '#011a44' -draw 'rectangle 7,3 300,34' \
            -font DejaVu-Sans-Bold -pointsize 18 -fill white \
            -draw "text 14,24 'U11 · TRÆNING 2 AF 6'" \
            assets/training2/u11-training2-card.png

      - name: Verify image
        run: |
          identify assets/training2/u11-training2-card.png
          python3 - <<'PY'
          from pathlib import Path
          b=Path('assets/training2/u11-training2-card.png').read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(b) > 100000
          print('PNG OK:', len(b), 'bytes')
          PY

      - name: Commit corrected card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/training2/u11-training2-card.png
          if git diff --cached --quiet; then
            echo 'No image change.'
            exit 0
          fi
          git commit -m 'Correct Training 2 card label to 2 of 6'
          git push

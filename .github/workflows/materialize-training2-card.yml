name: Materialize Training 2 card

on:
  push:
    paths:
      - '.github/workflows/materialize-training2-card.yml'
      - 'assets/training2/u11-training2-card.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source WebP
        run: |
          test -s assets/training2/u11-training2-card.webp
          file assets/training2/u11-training2-card.webp
          python3 - <<'PY'
          from pathlib import Path
          b=Path('assets/training2/u11-training2-card.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          assert len(b) > 50000
          print('Source WebP:', len(b), 'bytes')
          PY

      - name: Convert to Safari-safe PNG
        run: |
          ffmpeg -y -v error -i assets/training2/u11-training2-card.webp -frames:v 1 assets/training2/u11-training2-card.png

      - name: Verify PNG
        run: |
          test -s assets/training2/u11-training2-card.png
          file assets/training2/u11-training2-card.png
          python3 - <<'PY'
          from pathlib import Path
          b=Path('assets/training2/u11-training2-card.png').read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(b) > 50000
          print('Verified PNG:', len(b), 'bytes')
          PY

      - name: Commit PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/training2/u11-training2-card.png
          if git diff --cached --quiet; then
            echo 'PNG already current.'
            exit 0
          fi
          git commit -m 'Add Safari-safe Training 2 PNG'
          git push

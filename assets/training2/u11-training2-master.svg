R:</text><text class="yellow h2" x="410" y="72">BOLDKONTROL &amp; DRIBLING MOD MODSTANDERE</text><rect class="navy" x="18" y="124" width="280" height="185" rx="14"/><text class="white h2" x="36" y="158">I DAG SKAL VI:</text><text class="white p" x="40" y="198">✓ Have bolden tæt på</text><text class="white p" x="40" y="235">✓ Turde udfordre 1-mod-1</text><text class="white p" x="40" y="272">✓ Sætte fart, når vi er forbi</text><text class="ink h3" x="415" y="143">MANDAG · JACOB &amp; ALLAN</text><text class="ink h3" x="835" y="143">ONSDAG · LARS &amp; MADS</text><g transform="translate(415 220)"><use href="#coach"/><text class="white tiny" text-anchor="middle" x="0" y="51">JACOB</text></g><g transform="translate(545 220)"><use href="#coach"/><text class="white tiny" text-anchor="middle" x="0" y="51">ALLAN</text></g><g transform="translate(850 220)"><use href="#coach"/><text class="white tiny" text-anchor="middle" x="0" y="51">LARS</text></g><g transform="translate(980 220)"><use href="#coach"/><rect x="-17" y="-34" width="14" height="10" fill="none" stroke="#222"/><rect x="3" y="-34" width="14" height="10" fill="none" stroke="#222"/><text class="white tiny" text-anchor="middle" x="0" y="51">MADS</text></g><rect class="navy" x="0" y="326" width="1200" height="50"/><text class="white h2" text-anchor="middle" x="600" y="360">TRÆNING 2 AF 3 · 2 PRIMÆRE STATIONER Á 20 MINUTTER</text><rect class="card" x="18" y="395" width="570" height="780" rx="14"/><circle class="blue" cx="55" cy="435" r="25"/><text class="white h3" text-anchor="middle" x="55" y="442">A</text><text class="ink h2" x="90" y="444">DRIBLING OG VENDINGER</text><text class="muted sm" x="35" y="472">BANE: ca. 15 × 20 m · 1 bold pr. spiller</text><g transform="translate(35 500)"><rect class="pitch" width="535" height="195" rx="4"/><path class="line" d="M15 15H520V180H15Z"/><use href="#player" transform="translate(95 145)"/><path class="dash" d="M120 130C210 90 265 120 350 60"/><path class="cone" d="M345 55l10-24 10 24z"/><path class="cone" d="M300 92l10-24 10 24z"/><path class="cone" d="M255 130l10-24 10 24z"/><text class="white label" x="25" y="30">0–6 MIN · TEKNIK</text></g><text class="ink p" x="36" y="725">Dribl tæt på foden. Lav tydelige vendinger omkring keglerne.</text><g transform="translate(35 760)"><rect class="pitch" width="535" height="195" rx="4"/><path class="line" d="M15 15H520V180H15Z"/><use href="#player" transform="translate(95 145)"/><use href="#def" transform="translate(420 105)"/><path class="dash" d="M120 130C210 95 270 115 355 65"/><text class="white label" x="25" y="30">6–12 MIN · BESLUTNING</text><rect x="370" y="45" width="90" height="30" rx="15" fill="#fff"/><text class="ink tiny" text-anchor="middle" x="415" y="64">HØJRE!</text></g><text class="ink p" x="36" y="985">Vælg vending efter signal og pres. Beskyt bolden og accelerér.</text><g transform="translate(35 1015)"><rect class="pitch" width="535" height="135" rx="4"/><path class="line" d="M15 15H520V120H15Z"/><use href="#player" transform="translate(115 85) scale(.8)"/><use href="#def" transform="translate(300 70) scale(.8)"/><path class="dash" d="M140 80Q230 25 350 70"/><text class="white label" x="25" y="30">12–20 MIN · 1-MOD-1</text></g><rect class="card" x="612" y="395" width="570" height="780" rx="14"/><circle class="blue" cx="649" cy="435" r="25"/><text class="white h3" text-anchor="middle" x="649" y="442">B</text><text class="ink h2" x="684" y="444">PASNINGER OG BEVÆGELSE</text><text class="muted sm" x="630" y="472">BANE: ca. 15 × 20 m · 4–6 spillere pr. gruppe</text><g transform="translate(630 500)"><rect class="pitch" width="535" height="195" rx="4"/><path class="line" d="M15 15H520V180H15Z"/><use href="#player" transform="translate(105 90) scale(.8)"/><use href="#player" transform="translate(425 90) scale(.8)"/><use href="#player" transform="translate(105 155) scale(.8)"/><use href="#player" transform="translate(425 155) scale(.8)"/><path class="dash" d="M140 82H385"/><path class="dash" d="M140 147H385"/><text class="white label" x="25" y="30">0–6 MIN · AFLEVER &amp; FLYT</text></g><text class="ink p" x="630" y="725">Præcis aflevering. Bevæg dig straks efter bolden.</text><g transform="translate(630 760)"><rect class="pitch" width="535" height="195" rx="4"/><path class="line" d="M15 15H520V180H15Z"/><use href="#player" transform="translate(105 135) scale(.8)"/><use href="#player" transform="translate(265 55) scale(.8)"/><use href="#player" transform="translate(425 135) scale(.8)"/><path class="dash" d="M140 125L245 65"/><path class="dash" d="M285 65L395 125"/><path class="dash" d="M390 145L150 145"/><text class="white label" x="25" y="30">6–12 MIN · 1-2 &amp; MODLØB</text></g><text class="ink p" x="630" y="985">Spil, løb og find ny vinkel. Orientér før modtagelse.</text><g transform="translate(630 1015)"><rect class="pitch" width="535" height="135" rx="4"/><path class="line" d="M15 15H520V120H15Z"/><use href="#player" transform="translate(90 80) scale(.65)"/><use href="#player" transform="translate(220 45) scale(.65)"/><use href="#player" transform="translate(390 80) scale(.65)"/><use href="#def" transform="translate(270 95) scale(.65)"/><path class="dash" d="M120 75L200 50"/><path class="dash" d="M245 50L365 75"/><text class="white label" x="25" y="30">12–20 MIN · PRES-SPIL</text></g><rect class="navy" x="0" y="1195" width="1200" height="48"/><text class="white h2" text-anchor="middle" x="600" y="1228">2 ALTERNATIVER · SAMME FOKUS</text><rect class="card" x="18" y="1260" width="570" height="255" rx="14"/><circle class="blue" cx="55" cy="1300" r="25"/><text class="white h3" text-anchor="middle" x="55" y="1307">C</text><text class="ink h3" x="90" y="1307">1V1 MED JAGENDE FORSVARER</text><g transform="translate(35 1330)"><rect class="pitch" width="535" height="155" rx="4"/><path class="line" d="M15 15H520V140H15Z"/><use href="#player" transform="translate(140 105) scale(.75)"/><use href="#def" transform="translate(90 120) scale(.75)"/><path class="dash" d="M160 95Q275 25 430 70"/><path class="cone" d="M430 80l10-24 10 24z"/></g><rect class="card" x="612" y="1260" width="570" height="255" rx="14"/><circle class="blue" cx="649" cy="1300" r="25"/><text class="white h3" text-anchor="middle" x="649" y="1307">D</text><text class="ink h3" x="684" y="1307">2V1 · MODLØB &amp; AFSLUTNING</text><g transform="translate(630 1330)"><rect class="pitch" width="535" height="155" rx="4"/><path class="line" d="M15 15H520V140H15Z"/><use href="#player" transform="translate(110 110) scale(.75)"/><use href="#player" transform="translate(260 55) scale(.75)"/><use href="#def" transform="translate(370 95) scale(.75)"/><path class="dash" d="M135 100L235 62"/><path class="dash" d="M280 62L350 88"/><path d="M445 45v65h45V45z" fill="none" stroke="#fff" stroke-width="5"/></g><text class="ink h3" x="22" y="1550">COACHING:</text><text class="ink p" x="155" y="1550">Bold tæt · kig op · beskyt bolden · bevæg dig efter aflevering · sæt fart efter vending</text><text class="muted sm" x="22" y="1580">U11 · Fokusblok 1 · Træning 2 af 3</text></svg>
<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>U11 Træning · Træning 2</title><style>:root{--n:#061d3d;--b:#0f4d98;--g:#168b3d;--bg:#edf2f7;--t:#0d2a46}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--t)}.wrap{max-width:1040px;margin:auto;padding:10px}.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;background:#061d3df2;color:#fff;padding:10px 12px;border-radius:0 0 12px 12px}.toolbar small{display:block;opacity:.8;margin-top:2px}.buttons{display:flex;gap:7px}.btn{border:1px solid #ffffff55;background:#ffffff16;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none;font-size:12px;cursor:pointer}.poster-wrap{position:relative;margin-top:10px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 22px #06264d20;min-height:280px}.poster{display:block;width:100%;height:auto}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#607286;font-weight:700;z-index:2}.loading.hide{display:none}.hot{position:absolute;background:transparent;border:0;cursor:pointer;z-index:3}.a1{left:1.5%;top:28%;width:47%;height:15.8%}.a2{left:1.5%;top:43.8%;width:47%;height:15.8%}.a3{left:1.5%;top:59.6%;width:47%;height:16.8%}.b1{left:50%;top:28%;width:48.3%;height:15.8%}.b2{left:50%;top:43.8%;width:48.3%;height:15.8%}.b3{left:50%;top:59.6%;width:48.3%;height:16.8%}.hint{text-align:center;font-size:12px;color:#607286;margin:8px 0}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -12px 38px #001a3350;transform:translateY(105%);transition:.2s;max-height:80vh;overflow:auto}.sheet.open{transform:none}.head{background:var(--n);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;color:#fff;font-size:26px}.body{padding:15px}.id{display:inline-block;background:var(--b);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:900}.body h2{margin:8px 0}.muted{color:#62768a;font-size:13px}.section{border-top:1px solid #dbe3ea;margin-top:12px;padding-top:10px}.section h3{font-size:13px;margin:0 0 6px;color:#0e3f79}.section p,.section li{font-size:14px;line-height:1.45}.feedback{display:block;text-align:center;background:var(--g);color:#fff;text-decoration:none;border-radius:10px;padding:12px;font-weight:900;margin-top:14px}.backdrop{position:fixed;inset:0;background:#001b3355;z-index:40;display:none}.backdrop.on{display:block}@media(min-width:900px){.sheet{left:auto;width:440px;top:0;max-height:none;border-radius:0;transform:translateX(105%)}.sheet.open{transform:none}}@media print{body{background:#fff}.toolbar,.hint,.hot,.sheet,.backdrop,.loading{display:none!important}.wrap{max-width:none;padding:0}.poster-wrap{box-shadow:none;border-radius:0}}</style></head><body><div class="wrap"><div class="toolbar"><div><strong>U11 · TRÆNING 2</strong><small>Mandag 17. august · progression fra træning 1</small></div><div class="buttons"><button class="btn" id="downloadBtn" onclick="downloadPoster()" disabled>HENT TRÆNERKORT</button><a class="btn" href="archive.html">ARKIV</a></div></div><div class="poster-wrap"><div class="loading" id="loading">Henter trænerkort…</div><img class="poster" id="poster" alt="U11 træning 2"><button class="hot a1" onclick="openDrill('A1')" aria-label="A1"></button><button class="hot a2" onclick="openDrill('A2')" aria-label="A2"></button><button class="hot a3" onclick="openDrill('A3')" aria-label="A3"></button><button class="hot b1" onclick="openDrill('B1')" aria-label="B1"></button><button class="hot b2" onclick="openDrill('B2')" aria-label="B2"></button><button class="hot b3" onclick="openDrill('B3')" aria-label="B3"></button></div><div class="hint">Tryk direkte på en øvelse for opstilling, coaching, progression og feedback.</div></div><div class="backdrop" id="backdrop" onclick="closeSheet()"></div><aside class="sheet" id="sheet"><div class="head"><b>TRÆNING 2 · ØVELSESDETALJER</b><button class="close" onclick="closeSheet()">×</button></div><div class="body"><span class="id" id="sid"></span><h2 id="name"></h2><div class="muted" id="meta"></div><div class="section"><h3>OPSTILLING</h3><p id="setup"></p></div><div class="section"><h3>SÅDAN GØR VI</h3><ol id="steps"></ol></div><div class="section"><h3>COACHING</h3><p id="coach"></p></div><div class="section"><h3>PROGRESSION</h3><p id="prog"></p></div><a class="feedback" id="feedback" href="#">GIV FEEDBACK PÅ DENNE ØVELSE</a></div></aside><script>let posterData='';async function loadPoster(){const files=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt'];try{const parts=[];for(const f of files){const r=await fetch('assets/training2/'+f+'?v=2',{cache:'no-store'});if(!r.ok)throw Error(f);parts.push((await r.text()).trim())}posterData='data:image/webp;base64,'+parts.join('');const img=document.getElementById('poster');img.onload=()=>{loading.classList.add('hide');downloadBtn.disabled=false};img.onerror=()=>loading.textContent='Trænerkortet kunne ikke indlæses – genindlæs siden.';img.src=posterData}catch(e){loading.textContent='Trænerkortet kunne ikke indlæses – genindlæs siden.'}}function downloadPoster(){if(!posterData)return;const a=document.createElement('a');a.href=posterData;a.download='U11-traening-2-mandag-17-august.webp';a.click()}const D={A1:{id:'U34-MA-A1',name:'Boldkontrol – vending på signal',meta:'0–6 min · Station A',setup:'Samme kompakte bane som sidst. Én bold pr. spiller og 3–4 markører som vendepunkter.',steps:['Dribl med korte berøringer ind i banen.','Ved markør viser træneren retning sent.','Spilleren vender med inderside, yderside eller Cruyff-vending.','Sæt fart i 3–4 meter efter vendingen.'],coach:'Kig op før vending. Bolden tæt nok til at kunne skifte retning. Eksplodér bagefter.',prog:'Vi bygger direkte videre på træning 1: mindre teknik i isolation, mere orientering og valg.'},A2:{id:'U34-MA-A2',name:'1-mod-1 – pres fra siden',meta:'6–12 min · Station A',setup:'Angriber med bold starter let foran en forsvarer, som kommer ind fra siden.',steps:['Angriberen sætter i gang med bold.','Forsvareren må presse fra siden efter første berøring.','Angriberen beskytter bolden, vender væk eller udfordrer fremad.','Scor ved at drible gennem en af to porte.'],coach:'Krop mellem modstander og bold. Førsteberøring væk fra pres. Se hvor pladsen åbner.',prog:'Mindre afstand mellem spillerne gør øvelsen sværere. Skift side på presset ofte.'},A3:{id:'U34-MA-A3',name:'Pres-spil – 2v2 til to mål',meta:'12–20 min · Station A',setup:'Lille område med to små mål. 2 mod 2 og hurtige nye bolde fra træner.',steps:['2v2 starter på trænerens bold.','Boldholder udfordrer eller finder makker.','Spiller uden bold skaber bredde eller modløb.','Ved boldtab skal begge straks presse.'],coach:'Første tanke fremad. Hjælp boldholderen med bevægelse. Pres sammen efter boldtab.',prog:'Giv bonus for mål efter vending eller efter at have slået en modstander.'},B1:{id:'U34-MA-B1',name:'1-2 aflevering og løb',meta:'0–6 min · Station B',setup:'Tre spillere i trekant. Én bold. Korte afstande og masser af gentagelser.',steps:['A spiller B og løber forbi.','B lægger bolden tilbage i A’s løb.','A spiller videre til C.','Rollerne roterer med bolden.'],coach:'Pasning i rette fart. Løb med det samme efter aflevering. Returpasning foran medspilleren.',prog:'Brug begge fødder og varier vinklen på 1-2 kombinationen.'},B2:{id:'U34-MA-B2',name:'Modløb – spil, vend og find tredje mand',meta:'6–12 min · Station B',setup:'Fire spillere i diamant. Én central spiller kan komme i modløb.',steps:['Yderspiller spiller ind centralt.','Central spiller kommer imod bolden og vender eller lægger af.','En tredje spiller bevæger sig i ny vinkel.','Spil videre og roter positioner.'],coach:'Timing i modløbet. Orientér før modtagelse. Spil på den fod, der hjælper næste aktion.',prog:'Tilføj en passiv forsvarer, som gradvist må presse mere.'},B3:{id:'U34-MA-B3',name:'Pres-spil – 4v2 / 3v2',meta:'12–20 min · Station B',setup:'Firkant på ca. 12 × 12 m. Start 4v2; stærke grupper kan gå til 3v2.',steps:['Hold bolden i overtal.','Efter aflevering skal spilleren flytte sig og skabe ny vinkel.','Forsvarerne presser sammen og forsøger at styre spillet.','Ved boldtab bytter den ansvarlige spiller ind som forsvarer.'],coach:'Spil hurtigt når presset kommer. Brug 1-2 og modløb. Modtag med blik for næste pasning.',prog:'Mindre bane eller færre berøringer øger presset. Målet er at få dagens relationer ind i spillet.'}};function openDrill(k){const d=D[k];sid.textContent=d.id;name.textContent=d.name;meta.textContent=d.meta;setup.textContent=d.setup;steps.innerHTML='';d.steps.forEach(x=>{const li=document.createElement('li');li.textContent=x;steps.appendChild(li)});coach.textContent=d.coach;prog.textContent=d.prog;feedback.href='mailto:mail@madsmnielsen.dk?subject='+encodeURIComponent('U11 feedback · '+d.id)+'&body='+encodeURIComponent('Øvelse: '+d.id+'\n\nHvad virkede?\n\nHvad skal ændres?\n\nAndet:\n');sheet.classList.add('open');backdrop.classList.add('on')}function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('on')}loadPoster();</script></body></html>

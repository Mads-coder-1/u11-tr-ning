<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>U11 Træning · Træning 2</title><style>:root{--n:#061d3d;--g:#168b3d;--bg:#edf2f7;--t:#0d2a46}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--t)}.wrap{max-width:1200px;margin:auto;padding:8px}.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;background:#061d3df2;color:#fff;padding:10px 12px;border-radius:0 0 12px 12px}.toolbar small{display:block;opacity:.8}.btn{border:1px solid #ffffff55;background:#ffffff16;color:#fff;border-radius:9px;padding:8px 10px;font-weight:800;text-decoration:none;font-size:12px;cursor:pointer}.poster-wrap{position:relative;margin-top:10px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 22px #06264d20}.poster{display:block;width:100%;height:auto}.hot{position:absolute;background:transparent;border:0;cursor:pointer;z-index:3}.a{left:1.5%;top:24.5%;width:47.5%;height:49%}.b{left:51%;top:24.5%;width:47.5%;height:49%}.c{left:1.5%;top:78.5%;width:47.5%;height:16%}.d{left:51%;top:78.5%;width:47.5%;height:16%}.hint{text-align:center;font-size:12px;color:#607286;margin:8px}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -12px 38px #001a3350;transform:translateY(105%);transition:.2s;max-height:82vh;overflow:auto}.sheet.open{transform:none}.head{background:var(--n);color:#fff;padding:13px 16px;display:flex;justify-content:space-between}.close{border:0;background:none;color:#fff;font-size:26px}.body{padding:15px}.id{background:#0f4d98;color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:900}.section{border-top:1px solid #dbe3ea;margin-top:12px;padding-top:10px}.section h3{font-size:13px;margin:0 0 6px;color:#0e3f79}.section p,.section li{font-size:14px;line-height:1.45}.feedback{display:block;text-align:center;background:var(--g);color:#fff;text-decoration:none;border-radius:10px;padding:12px;font-weight:900;margin-top:14px}.backdrop{position:fixed;inset:0;background:#001b3355;z-index:40;display:none}.backdrop.on{display:block}@media(min-width:900px){.sheet{left:auto;width:440px;top:0;max-height:none;border-radius:0;transform:translateX(105%)}}@media print{.toolbar,.hint,.hot,.sheet,.backdrop{display:none!important}.wrap{max-width:none;padding:0}.poster-wrap{box-shadow:none;border-radius:0}}</style></head><body><div class="wrap"><div class="toolbar"><div><strong>U11 · TRÆNING 2 AF 3</strong><small>Fokus: Boldkontrol og dribling mod modstandere</small></div><div><a class="btn" href="assets/training2/u11-training2-master.svg" download="U11-traening-2.svg">HENT TRÆNERKORT</a> <a class="btn" href="archive.html">ARKIV</a></div></div><div class="poster-wrap"><img class="poster" src="assets/training2/u11-training2-master.svg?v=20260816-2" alt="U11 Træning 2"><button class="hot a" onclick="openDrill('A')" aria-label="Station A"></button><button class="hot b" onclick="openDrill('B')" aria-label="Station B"></button><button class="hot c" onclick="openDrill('C')" aria-label="Alternativ C"></button><button class="hot d" onclick="openDrill('D')" aria-label="Alternativ D"></button></div><div class="hint">Tryk på A, B, C eller D for detaljer og feedback.</div></div><div class="backdrop" id="backdrop" onclick="closeSheet()"></div><aside class="sheet" id="sheet"><div class="head"><b>TRÆNING 2 · DETALJER</b><button class="close" onclick="closeSheet()">×</button></div><div class="body"><span class="id" id="sid"></span><h2 id="name"></h2><div class="section"><h3>OPSTILLING</h3><p id="setup"></p></div><div class="section"><h3>PROGRESSION</h3><ol id="steps"></ol></div><div class="section"><h3>COACHING</h3><p id="coach"></p></div><a class="feedback" id="feedback">GIV FEEDBACK PÅ DENNE ØVELSE</a></div></aside><script>const D={A:{id:'T2-A',name:'Station A · Dribling og vendinger',setup:'Ca. 15 × 20 m. Én bold pr. spiller. Samme grundområde bruges gennem hele stationen.',steps:['0–6 min: Dribl med tæt boldkontrol og vendinger.','6–12 min: Vælg vending/retning efter signal og pres.','12–20 min: 1-mod-1 med reelt pres og acceleration efter vending.'],coach:'Bold tæt på. Kig op. Brug kroppen til at beskytte. Tydelig vending og fart bagefter.'},B:{id:'T2-B',name:'Station B · Pasninger og bevægelse',setup:'Ca. 15 × 20 m. 4–6 spillere. Samme område udvikles fra aflevering til pres-spil.',steps:['0–6 min: Præcis aflevering og bevægelse efter bolden.','6–12 min: 1-2 og modløb med timing.','12–20 min: 4v2/3v2 – hurtige afleveringer og fælles pres ved boldtab.'],coach:'Spil i rette fart. Bevæg dig straks efter aflevering. Orientér før modtagelse. Pres sammen.'},C:{id:'T2-C',name:'Alternativ C · 1-mod-1 med jagende forsvarer',setup:'Angriber med bold. Forsvarer starter lidt bagved eller skråt fra siden.',steps:['Angriberen sætter fart.','Forsvareren jagter og presser aktivt.','Angriberen beskytter bolden og vælger vending eller gennembrud.','Byt roller.'],coach:'Fart med kontrol. Krop mellem modstander og bold. Kig efter fri plads.'},D:{id:'T2-D',name:'Alternativ D · 2-mod-1 med modløb og afslutning',setup:'To angribere mod én forsvarer og mål/port.',steps:['Boldholder spiller eller udfordrer.','Makker skaber modløb/vinkel.','Brug 1-2 når forsvareren træder frem.','Afslut hurtigt og roter roller.'],coach:'Timing i løbet. Spil foran medspilleren. Kig på forsvarerens position før valget.'}};function openDrill(k){const d=D[k];sid.textContent=d.id;name.textContent=d.name;setup.textContent=d.setup;steps.innerHTML='';d.steps.forEach(x=>{const li=document.createElement('li');li.textContent=x;steps.appendChild(li)});coach.textContent=d.coach;feedback.href='mailto:mail@madsmnielsen.dk?subject='+encodeURIComponent('U11 feedback · '+d.id)+'&body='+encodeURIComponent('Øvelse: '+d.id+'\nProgression/trin: \n\nHvad virkede?\n\nHvad skal ændres?\n');sheet.classList.add('open');backdrop.classList.add('on')}function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('on')}</script></body></html>

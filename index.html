oseSheet()"></div><aside class="sheet" id="sheet"><div class="head"><b>TRÆNING 2 · DETALJER</b><button class="close" onclick="closeSheet()">×</button></div><div class="body"><span class="id" id="sid"></span><h2 id="name"></h2><div class="section"><h3>OPSTILLING</h3><p id="setup"></p></div><div class="section"><h3>PROGRESSION</h3><ol id="steps"></ol></div><div class="section"><h3>COACHING</h3><p id="coach"></p></div><a class="feedback" id="feedback">GIV FEEDBACK PÅ DENNE ØVELSE</a></div></aside><script>let posterData='';async function loadPoster(){try{const parts=[];for(let i=1;i<=7;i++){const f='p'+String(i).padStart(2,'0')+'.txt';const r=await fetch('assets/training2/'+f+'?fix=20260816',{cache:'no-store'});if(!r.ok)throw new Error(f);parts.push((await r.text()).trim())}posterData='data:image/webp;base64,'+parts.join('');poster.onload=()=>{loading.classList.add('hide');downloadBtn.disabled=false};poster.onerror=()=>{loading.textContent='Trænerkortet kunne ikke indlæses – genindlæs siden.'};poster.src=posterData}catch(e){loading.textContent='Trænerkortet kunne ikke indlæses – genindlæs siden.'}}function downloadPoster(){if(!posterData)return;const a=document.createElement('a');a.href=posterData;a.download='U11-traening-2.webp';a.click()}const D={A:{id:'T2-A',name:'Station A · Dribling og vendinger',setup:'Ca. 15 × 20 m. Én bold pr. spiller. Samme grundområde bruges gennem hele stationen.',steps:['0–6 min: Dribl med tæt boldkontrol og vendinger.','6–12 min: Beslutning – vælg vending/retning efter signal og pres.','12–20 min: 1-mod-1 med reelt pres og acceleration efter vending.'],coach:'Bold tæt på. Kig op. Brug kroppen til at beskytte. Tydelig vending og fart bagefter.'},B:{id:'T2-B',name:'Station B · 1-2, modløb og pres-spil',setup:'Ca. 15 × 20 m. 4–6 spillere. Start med korte kombinationer og udvikl samme område til pres-spil.',steps:['0–6 min: Præcis aflevering og bevægelse efter bolden.','6–12 min: 1-2 og modløb med timing.','12–20 min: 4v2/3v2 – hurtige afleveringer og fælles pres ved boldtab.'],coach:'Spil i rette fart. Bevæg dig straks efter aflevering. Orientér før modtagelse. Pres sammen.'},C:{id:'T2-C',name:'Alternativ C · 1-mod-1 med jagende forsvarer',setup:'Ca. 15 × 20 m. Angriber med bold og forsvarer, der starter lidt bagved/skråt fra siden.',steps:['Angriberen sætter fart mod mål/port.','Forsvareren jagter og må presse aktivt.','Angriberen beskytter bolden og vælger vending eller gennembrud.','Byt roller efter hver tur.'],coach:'Fart med kontrol. Krop mellem modstander og bold. Kig efter fri plads. Accelerér efter retningsskift.'},D:{id:'T2-D',name:'Alternativ D · 2-mod-1 med pasning, modløb og afslutning',setup:'Ca. 20 × 15 m. To angribere mod én forsvarer og mål/port.',steps:['Boldholder spiller eller udfordrer.','Makker skaber modløb/vinkel.','Brug 1-2 når forsvareren træder frem.','Afslut hurtigt og roter roller.'],coach:'Timing i løbet. Spil foran medspilleren. Kig på forsvarerens position før valget. Bevæg dig efter aflevering.'}};function openDrill(k){const d=D[k];sid.textContent=d.id;name.textContent=d.name;setup.textContent=d.setup;steps.innerHTML='';d.steps.forEach(x=>{const li=document.createElement('li');li.textContent=x;steps.appendChild(li)});coach.textContent=d.coach;feedback.href='mailto:mail@madsmnielsen.dk?subject='+encodeURIComponent('U11 feedback · '+d.id)+'&body='+encodeURIComponent('Øvelse: '+d.id+'\nProgression/trin (hvis relevant): \n\nHvad virkede?\n\nHvad skal ændres?\n\nAndet:\n');sheet.classList.add('open');backdrop.classList.add('on')}function closeSheet(){sheet.classList.remove('open');backdrop.classList.remove('on')}loadPoster();</script></body></html>
